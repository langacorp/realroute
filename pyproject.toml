[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "realroute"
dynamic = ["version"]
description = "Check that a route really exists, by content and not by status code."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LANGA Corp. Srl", email = "opensource@langa.tv"}]
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Site Management :: Link Checking",
]

[project.urls]
Homepage = "https://github.com/langacorp/realroute"
Source = "https://github.com/langacorp/realroute"
Changelog = "https://github.com/langacorp/realroute/blob/main/CHANGELOG.md"

[project.scripts]
realroute = "realroute:_entry"

[tool.setuptools]
py-modules = ["realroute"]

[tool.setuptools.dynamic]
version = {attr = "realroute.__version__"}
